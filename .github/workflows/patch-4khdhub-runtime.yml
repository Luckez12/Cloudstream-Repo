name: Patch 4KHDHub Runtime Fix

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle 8.12
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.12"

      - name: Apply guarded 4KHDHub patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > "$RUNNER_TEMP/apply_4khdhub_runtime_fix.py"
          python3 "$RUNNER_TEMP/apply_4khdhub_runtime_fix.py" "$GITHUB_WORKSPACE"
          git diff --check
          git diff -- \
            4KHDHub/src/main/kotlin/com/fourkhdhub/Extractors.kt \
            4KHDHub/src/main/kotlin/com/fourkhdhub/FourKHDHubProvider.kt

      - name: Build and verify providers
        shell: bash
        run: |
          set -euo pipefail
          gradle make makePluginsJson ensureJarCompatibility --no-daemon

      - name: Commit verified patch
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            4KHDHub/src/main/kotlin/com/fourkhdhub/Extractors.kt \
            4KHDHub/src/main/kotlin/com/fourkhdhub/FourKHDHubProvider.kt

          if git diff --cached --quiet; then
            echo "No source changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Fix 4KHDHub runtime extraction"
          git push origin HEAD:main
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger normal CloudStream publish build
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run build.yml --ref main

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## 4KHDHub runtime patch"
            echo
            echo "Patch target: HubCloud Cloudflare fallback, early source emission, HubCDN media validation."
            echo "Commit created: `${{ steps.commit.outputs.committed || 'false' }}`"
          } >> "$GITHUB_STEP_SUMMARY"
