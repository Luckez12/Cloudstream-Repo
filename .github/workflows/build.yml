name: CloudStream Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"

permissions:
  contents: write

concurrency:
  group: cloudstream-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle 8.12
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.12"

      - name: Validate repository foundation
        shell: bash
        run: |
          set -euo pipefail

          test -f build.gradle.kts
          test -f settings.gradle.kts
          test -f gradle.properties
          test -f repo.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          repo = json.loads(Path("repo.json").read_text(encoding="utf-8"))

          assert repo["manifestVersion"] == 1
          assert repo["pluginLists"] == [
              "https://raw.githubusercontent.com/Luckez12/Cloudstream-Repo/builds/plugins.json"
          ]

          print("repo.json validation passed")
          PY

          gradle tasks --no-daemon

      - name: Detect provider modules
        id: modules
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t MODULES < <(
            find . \
              -mindepth 2 \
              -maxdepth 2 \
              -type f \
              -name build.gradle.kts \
              -not -path "./.git/*" \
              -not -path "./.github/*" \
              -printf "%h\n" |
            sed 's#^\./##' |
            sort -u
          )

          if [[ ${#MODULES[@]} -eq 0 ]]; then
            echo "No provider modules are present."
            echo "has_modules=false" >> "$GITHUB_OUTPUT"
          else
            echo "Provider modules:"
            printf '  %s\n' "${MODULES[@]}"
            echo "has_modules=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and verify providers
        if: steps.modules.outputs.has_modules == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gradle make makePluginsJson ensureJarCompatibility --no-daemon

      - name: Prepare published repository
        shell: bash
        run: |
          set -euo pipefail

          PUBLISH_DIR="$RUNNER_TEMP/cloudstream-publish"
          rm -rf "$PUBLISH_DIR"
          mkdir -p "$PUBLISH_DIR"

          if [[ "${{ steps.modules.outputs.has_modules }}" == "true" ]]; then
            if [[ ! -f build/plugins.json ]]; then
              echo "::error::build/plugins.json was not generated."
              exit 1
            fi

            find . -type f \( -path "*/build/*.cs3" -o -path "*/build/*.jar" \) \
              -exec cp {} "$PUBLISH_DIR/" \;

            CS3_COUNT="$(find "$PUBLISH_DIR" -maxdepth 1 -type f -name "*.cs3" | wc -l)"

            if [[ "$CS3_COUNT" -eq 0 ]]; then
              echo "::error::Provider modules were detected but no .cs3 files were generated."
              exit 1
            fi

            cp build/plugins.json "$PUBLISH_DIR/plugins.json"
          else
            printf '[]\n' > "$PUBLISH_DIR/plugins.json"
          fi

          cp repo.json "$PUBLISH_DIR/repo.json"

          python3 - "$PUBLISH_DIR" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])

          json.loads((root / "repo.json").read_text(encoding="utf-8"))
          plugins = json.loads((root / "plugins.json").read_text(encoding="utf-8"))

          if not isinstance(plugins, list):
              raise SystemExit("plugins.json must contain a JSON list")

          print(f"Publish validation passed with {len(plugins)} plugin entries")
          PY

      - name: Publish builds branch
        shell: bash
        run: |
          set -euo pipefail

          PUBLISH_DIR="$RUNNER_TEMP/cloudstream-publish"
          BUILDS_DIR="$RUNNER_TEMP/cloudstream-builds"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf "$BUILDS_DIR"
          git fetch origin builds || true

          if git show-ref --verify --quiet refs/remotes/origin/builds; then
            git worktree add -B builds "$BUILDS_DIR" origin/builds
          else
            git worktree add --detach "$BUILDS_DIR" HEAD

            (
              cd "$BUILDS_DIR"
              git switch --orphan builds
            )
          fi

          (
            cd "$BUILDS_DIR"

            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            cp -a "$PUBLISH_DIR"/. .

            git add -A

            if git diff --cached --quiet; then
              echo "Published files are unchanged."
              exit 0
            fi

            git commit -m "Build ${GITHUB_SHA}"
            git push origin builds --force
          )

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## CloudStream repository"
            echo
            echo "* Source branch: \`${GITHUB_REF_NAME}\`"
            echo "* Providers present: \`${{ steps.modules.outputs.has_modules || 'unknown' }}\`"
            echo "* Repo URL: \`https://raw.githubusercontent.com/Luckez12/Cloudstream-Repo/main/repo.json\`"
          } >> "$GITHUB_STEP_SUMMARY"
