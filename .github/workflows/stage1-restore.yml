name: CloudStream Stage 1 Restore

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudstream-stage1-restore
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.0

      - name: Setup Gradle 8.12
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.12'

      - name: Rebuild clean foundation
        shell: bash
        run: |
          set -euo pipefail

          rm -f d.kt
          rm -rf KissKH
          mkdir -p KissKH/src/main/kotlin/com/luckez12/kisskh
          mkdir -p .github/workflows

          cat > settings.gradle.kts <<'EOF'
          rootProject.name = "CloudstreamPlugins"

          val disabled = listOf<String>()

          File(rootDir, ".").eachDir { dir ->
              if (!disabled.contains(dir.name) && File(dir, "build.gradle.kts").exists()) {
                  include(dir.name)
              }
          }

          fun File.eachDir(block: (File) -> Unit) {
              listFiles()?.filter { it.isDirectory }?.forEach { block(it) }
          }
          EOF

          cat > build.gradle.kts <<'EOF'
          import com.android.build.gradle.BaseExtension
          import com.lagradost.cloudstream3.gradle.CloudstreamExtension
          import org.jetbrains.kotlin.gradle.dsl.JvmTarget
          import org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile

          buildscript {
              repositories {
                  google()
                  mavenCentral()
                  maven("https://jitpack.io")
              }

              dependencies {
                  classpath("com.android.tools.build:gradle:8.7.3")
                  classpath("com.github.recloudstream:gradle:-SNAPSHOT")
                  classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.0")
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven("https://jitpack.io")
              }
          }

          fun Project.cloudstream(configuration: CloudstreamExtension.() -> Unit) =
              extensions.getByName<CloudstreamExtension>("cloudstream").configuration()

          fun Project.android(configuration: BaseExtension.() -> Unit) =
              extensions.getByName<BaseExtension>("android").configuration()

          subprojects {
              apply(plugin = "com.android.library")
              apply(plugin = "kotlin-android")
              apply(plugin = "com.lagradost.cloudstream3.gradle")

              cloudstream {
                  setRepo(System.getenv("GITHUB_REPOSITORY") ?: "Luckez12/Cloudstream-Repo")
                  authors = listOf("Luckez12")
              }

              android {
                  namespace = "com.luckez12.cloudstream"

                  defaultConfig {
                      minSdk = 21
                      compileSdkVersion(35)
                      targetSdk = 35
                  }

                  compileOptions {
                      sourceCompatibility = JavaVersion.VERSION_1_8
                      targetCompatibility = JavaVersion.VERSION_1_8
                  }

                  tasks.withType<KotlinJvmCompile> {
                      compilerOptions {
                          jvmTarget.set(JvmTarget.JVM_1_8)
                          freeCompilerArgs.addAll(
                              "-Xno-call-assertions",
                              "-Xno-param-assertions",
                              "-Xno-receiver-assertions"
                          )
                      }
                  }
              }

              dependencies {
                  val implementation by configurations

                  implementation("com.github.recloudstream.cloudstream:library:-SNAPSHOT")
                  implementation(kotlin("stdlib"))
                  implementation("com.fasterxml.jackson.module:jackson-module-kotlin:2.13.1")
              }
          }

          tasks.register<Delete>("clean") {
              delete(rootProject.layout.buildDirectory)
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat > repo.json <<'EOF'
          {
            "name": "Luckez12 CloudStream Repo",
            "description": "CloudStream extensions maintained by Luckez12",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/Luckez12/Cloudstream-Repo/builds/plugins.json"
            ]
          }
          EOF

          cat > .gitignore <<'EOF'
          .gradle/
          .idea/
          local.properties
          **/build/
          build/
          *.iml
          .DS_Store
          EOF

          cat > README.md <<'EOF'
          # Luckez12 CloudStream Repo

          Clean CloudStream extension repository maintained by Luckez12.

          Repository URL for CloudStream:

          `https://raw.githubusercontent.com/Luckez12/Cloudstream-Repo/main/repo.json`

          ## Providers

          - KissKH
          EOF

          cat > KissKH/build.gradle.kts <<'EOF'
          version = 2

          cloudstream {
              description = "KissKH"
              authors = listOf("Luckez12")
              language = "en"
              status = 1
              tvTypes = listOf("Movie", "TvSeries", "Anime")
              requiresResources = false
          }
          EOF

          cat > KissKH/src/main/kotlin/com/luckez12/kisskh/KissKHPlugin.kt <<'EOF'
          package com.luckez12.kisskh

          import android.content.Context
          import com.lagradost.cloudstream3.plugins.CloudstreamPlugin
          import com.lagradost.cloudstream3.plugins.Plugin

          @CloudstreamPlugin
          class KissKHPlugin : Plugin() {
              override fun load(context: Context) {
                  registerMainAPI(KissKHProvider())
              }
          }
          EOF

          cat > KissKH/src/main/kotlin/com/luckez12/kisskh/KissKHProvider.kt <<'EOF'
          package com.luckez12.kisskh

          import com.fasterxml.jackson.databind.JsonNode
          import com.lagradost.cloudstream3.*
          import com.lagradost.cloudstream3.utils.ExtractorLink
          import com.lagradost.cloudstream3.utils.ExtractorLinkType
          import com.lagradost.cloudstream3.utils.Qualities
          import com.lagradost.cloudstream3.utils.newExtractorLink
          import java.net.URLEncoder
          import java.nio.charset.StandardCharsets

          class KissKHProvider : MainAPI() {
              override var mainUrl = "https://kisskh.co"
              override var name = "KissKH"
              override var lang = "en"

              override val supportedTypes = setOf(
                  TvType.Movie,
                  TvType.TvSeries,
                  TvType.Anime,
              )

              override val hasMainPage = false
              override val hasChromecastSupport = false

              private val headers: Map<String, String>
                  get() = mapOf(
                      "User-Agent" to USER_AGENT,
                      "Accept" to "application/json, text/plain, */*",
                      "Referer" to "$mainUrl/",
                  )

              override suspend fun search(query: String): List<SearchResponse> {
                  if (query.isBlank()) return emptyList()

                  val url = "$mainUrl/api/DramaList/Search?q=${enc(query.trim())}"
                  val root = mapper.readTree(
                      app.get(url, headers = headers, cacheTime = 0).text
                  )

                  return arrayNodes(root).mapNotNull { item ->
                      val id = item.intValue("id", "ID") ?: return@mapNotNull null
                      val title = item.textValue("title", "Title", "name", "Name")
                          ?.takeIf { it.isNotBlank() }
                          ?: return@mapNotNull null

                      val poster = absoluteUrl(
                          item.textValue(
                              "thumbnail", "Thumbnail",
                              "poster", "Poster",
                              "image", "Image",
                          )
                      )

                      val type = parseType(item.textValue("type", "Type"))
                      val detailsUrl = "$mainUrl/Drama/${slug(title)}?id=$id"

                      when (type) {
                          TvType.Movie -> newMovieSearchResponse(
                              title,
                              detailsUrl,
                              TvType.Movie,
                          ) {
                              posterUrl = poster
                          }

                          TvType.Anime -> newAnimeSearchResponse(
                              title,
                              detailsUrl,
                              TvType.Anime,
                          ) {
                              posterUrl = poster
                          }

                          else -> newTvSeriesSearchResponse(
                              title,
                              detailsUrl,
                              TvType.TvSeries,
                          ) {
                              posterUrl = poster
                          }
                      }
                  }
              }

              override suspend fun load(url: String): LoadResponse? {
                  val id = queryValue(url, "id")?.toIntOrNull() ?: return null

                  val root = mapper.readTree(
                      app.get(
                          "$mainUrl/api/DramaList/Drama/$id?isq=false",
                          headers = headers,
                          cacheTime = 0,
                      ).text
                  )

                  val title = root.textValue("title", "Title", "name", "Name")
                      ?.takeIf { it.isNotBlank() }
                      ?: return null

                  val type = parseType(root.textValue("type", "Type"))

                  val poster = absoluteUrl(
                      root.textValue(
                          "thumbnail", "Thumbnail",
                          "poster", "Poster",
                          "image", "Image",
                      )
                  )

                  val plot = root.textValue(
                      "description", "Description",
                      "synopsis", "Synopsis",
                  )

                  val year = Regex("""\b(?:19|20)\d{2}\b""")
                      .find(
                          root.textValue(
                              "releaseDate", "ReleaseDate",
                              "release", "Release",
                          ).orEmpty()
                      )
                      ?.value
                      ?.toIntOrNull()

                  val episodeNodes = arrayNodes(root.getIgnoreCase("episodes"))

                  val episodes = episodeNodes.mapNotNull { ep ->
                      val epId = ep.intValue("id", "ID") ?: return@mapNotNull null
                      val number = ep.doubleValue("number", "Number")
                          ?: ep.doubleValue("episode", "Episode")
                          ?: return@mapNotNull null

                      val numberText = cleanNumber(number)
                      val data = "$mainUrl/Drama/${slug(title)}/Episode-$numberText" +
                          "?id=$id&ep=$epId&page=0&pageSize=100"

                      newEpisode(data) {
                          name = "Episode $numberText"
                          episode = if (number % 1.0 == 0.0) number.toInt() else null
                      }
                  }

                  if (type == TvType.Movie) {
                      val dataUrl = episodes.firstOrNull()?.data.orEmpty()

                      return newMovieLoadResponse(
                          title,
                          url,
                          TvType.Movie,
                          dataUrl = dataUrl,
                      ) {
                          posterUrl = poster
                          this.plot = plot
                          this.year = year
                      }
                  }

                  return newTvSeriesLoadResponse(
                      title,
                      url,
                      type,
                      episodes,
                  ) {
                      posterUrl = poster
                      this.plot = plot
                      this.year = year
                  }
              }

              override suspend fun loadLinks(
                  data: String,
                  isCasting: Boolean,
                  subtitleCallback: (SubtitleFile) -> Unit,
                  callback: (ExtractorLink) -> Unit,
              ): Boolean {
                  if (data.isBlank()) return false

                  val page = runCatching {
                      app.get(
                          data,
                          headers = headers + ("Referer" to "$mainUrl/"),
                          cacheTime = 0,
                      ).text
                  }.getOrNull().orEmpty()

                  val direct = findMediaUrl(page) ?: return false

                  callback(
                      newExtractorLink(
                          source = name,
                          name = name,
                          url = direct,
                          type = ExtractorLinkType.VIDEO,
                      ) {
                          referer = data
                          quality = Qualities.Unknown.value
                      }
                  )

                  return true
              }

              private fun findMediaUrl(raw: String): String? {
                  val text = raw
                      .replace("\\u0026", "&")
                      .replace("\\/", "/")
                      .replace("&amp;", "&")

                  return Regex(
                      """https?://[^\s"'<>\\]+\.m3u8(?:\?[^\s"'<>\\]*)?""",
                      RegexOption.IGNORE_CASE,
                  ).find(text)?.value
                      ?: Regex(
                          """https?://[^\s"'<>\\]+\.mp4(?:\?[^\s"'<>\\]*)?""",
                          RegexOption.IGNORE_CASE,
                      ).find(text)?.value
              }

              private fun parseType(value: String?): TvType =
                  when (value?.trim()?.lowercase()) {
                      "movie", "film" -> TvType.Movie
                      "anime" -> TvType.Anime
                      else -> TvType.TvSeries
                  }

              private fun cleanNumber(number: Double): String =
                  if (number % 1.0 == 0.0) {
                      number.toInt().toString()
                  } else {
                      number.toString().trimEnd('0').trimEnd('.')
                  }

              private fun enc(value: String): String =
                  URLEncoder.encode(value, StandardCharsets.UTF_8.toString())

              private fun slug(value: String): String =
                  value.trim()
                      .replace(Regex("""[^\p{L}\p{N}]+"""), "-")
                      .trim('-')
                      .ifBlank { "Drama" }

              private fun queryValue(url: String, key: String): String? =
                  Regex("""(?:[?&])${Regex.escape(key)}=([^&#]+)""")
                      .find(url)
                      ?.groupValues
                      ?.getOrNull(1)

              private fun absoluteUrl(value: String?): String? {
                  val url = value?.trim()?.takeIf { it.isNotBlank() } ?: return null

                  return when {
                      url.startsWith("https://") || url.startsWith("http://") -> url
                      url.startsWith("//") -> "https:$url"
                      url.startsWith("/") -> "$mainUrl$url"
                      else -> "$mainUrl/$url"
                  }
              }

              private fun arrayNodes(node: JsonNode?): List<JsonNode> {
                  if (node == null || node.isNull) return emptyList()
                  if (node.isArray) return node.toList()

                  listOf(
                      "data", "Data",
                      "result", "Result",
                      "items", "Items",
                      "dramas", "Dramas",
                  ).forEach { key ->
                      val child = node.get(key)
                      if (child?.isArray == true) return child.toList()
                  }

                  return emptyList()
              }

              private fun JsonNode.getIgnoreCase(key: String): JsonNode? {
                  get(key)?.let { return it }

                  val iterator = fields()
                  while (iterator.hasNext()) {
                      val entry = iterator.next()
                      if (entry.key.equals(key, ignoreCase = true)) {
                          return entry.value
                      }
                  }

                  return null
              }

              private fun JsonNode.textValue(vararg keys: String): String? {
                  keys.forEach { key ->
                      val node = getIgnoreCase(key)
                      if (node != null && !node.isNull) {
                          val value = node.asText()
                          if (value.isNotBlank() && value != "null") return value
                      }
                  }

                  return null
              }

              private fun JsonNode.intValue(vararg keys: String): Int? {
                  keys.forEach { key ->
                      val node = getIgnoreCase(key) ?: return@forEach
                      if (node.isInt || node.isLong) return node.asInt()
                      node.asText().toIntOrNull()?.let { return it }
                  }

                  return null
              }

              private fun JsonNode.doubleValue(vararg keys: String): Double? {
                  keys.forEach { key ->
                      val node = getIgnoreCase(key) ?: return@forEach
                      if (node.isNumber) return node.asDouble()
                      node.asText().toDoubleOrNull()?.let { return it }
                  }

                  return null
              }
          }
          EOF

          cat > .github/workflows/build.yml <<'EOF'
          name: CloudStream Build

          on:
            workflow_dispatch:
            push:
              branches:
                - main
              paths-ignore:
                - '**/*.md'

          permissions:
            contents: write

          concurrency:
            group: cloudstream-build-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            build:
              runs-on: ubuntu-latest

              steps:
                - name: Checkout
                  uses: actions/checkout@v7
                  with:
                    fetch-depth: 0

                - name: Setup JDK 17
                  uses: actions/setup-java@v5
                  with:
                    distribution: temurin
                    java-version: '17'

                - name: Setup Android SDK
                  uses: android-actions/setup-android@v4.0.0

                - name: Setup Gradle
                  uses: gradle/actions/setup-gradle@v6

                - name: Build plugins
                  shell: bash
                  run: |
                    set -o pipefail
                    chmod +x gradlew
                    ./gradlew make makePluginsJson --no-daemon 2>&1 | tee build.log

                - name: Check CloudStream JAR compatibility
                  shell: bash
                  run: |
                    set -o pipefail
                    ./gradlew ensureJarCompatibility --no-daemon 2>&1 | tee -a build.log

                - name: Validate build output
                  shell: bash
                  run: |
                    set -euo pipefail

                    test -f build/plugins.json

                    python3 - <<'PY'
                    import json
                    from pathlib import Path

                    plugins = json.loads(Path("build/plugins.json").read_text())
                    if not isinstance(plugins, list):
                        raise SystemExit("build/plugins.json is not a JSON list")
                    if not plugins:
                        raise SystemExit("build/plugins.json is empty")
                    if not any(str(item.get("name", "")).lower() == "kisskh" for item in plugins if isinstance(item, dict)):
                        raise SystemExit("KissKH is missing from build/plugins.json")
                    print(f"Validated {len(plugins)} plugin entry/entries")
                    PY

                    CS3_COUNT="$(find . -type f -path '*/build/*.cs3' | wc -l)"
                    if [[ "$CS3_COUNT" -lt 1 ]]; then
                      echo "::error::No .cs3 plugin was generated."
                      exit 1
                    fi

                - name: Publish builds branch
                  shell: bash
                  run: |
                    set -euo pipefail

                    git config user.name "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                    PUBLISH_DIR="$RUNNER_TEMP/cloudstream-publish"
                    BUILDS_DIR="$RUNNER_TEMP/cloudstream-builds"

                    rm -rf "$PUBLISH_DIR" "$BUILDS_DIR"
                    mkdir -p "$PUBLISH_DIR"

                    while IFS= read -r -d '' file; do
                      cp "$file" "$PUBLISH_DIR/"
                    done < <(find . -type f -path '*/build/*.cs3' -print0)

                    cp build/plugins.json "$PUBLISH_DIR/plugins.json"
                    cp repo.json "$PUBLISH_DIR/repo.json"

                    git fetch origin builds || true

                    if git show-ref --verify --quiet refs/remotes/origin/builds; then
                      git worktree add -B builds "$BUILDS_DIR" origin/builds
                    else
                      git worktree add --detach "$BUILDS_DIR" HEAD
                      (
                        cd "$BUILDS_DIR"
                        git switch --orphan builds
                      )
                    fi

                    (
                      cd "$BUILDS_DIR"
                      find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
                      cp -a "$PUBLISH_DIR"/. .
                      git add -A

                      if git diff --cached --quiet; then
                        echo "Build outputs are unchanged."
                      else
                        git commit -m "Build ${GITHUB_SHA}"
                        git push origin builds --force
                      fi
                    )

                - name: Build summary
                  if: always()
                  shell: bash
                  run: |
                    {
                      echo "## CloudStream build"
                      echo
                      echo "- Commit: \`${GITHUB_SHA}\`"
                      echo "- Provider: \`KissKH\`"
                      echo "- JVM bytecode target: \`1.8\`"
                      echo "- Gradle wrapper: \`8.12\`"
                      echo "- Compatibility check: \`ensureJarCompatibility\`"
                    } >> "$GITHUB_STEP_SUMMARY"

                - name: Upload diagnose
                  if: always()
                  uses: actions/upload-artifact@v6
                  with:
                    name: cloudstream-build-diagnose
                    path: |
                      build.log
                      build/plugins.json
                      **/build/*.cs3
                    if-no-files-found: warn
          EOF

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 8.12 --distribution-type bin
          chmod +x gradlew

      - name: Validate restored source
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          repo = json.loads(Path("repo.json").read_text())
          expected = "https://raw.githubusercontent.com/Luckez12/Cloudstream-Repo/builds/plugins.json"

          assert repo["manifestVersion"] == 1
          assert repo["pluginLists"] == [expected]

          provider = Path("KissKH/src/main/kotlin/com/luckez12/kisskh/KissKHProvider.kt").read_text()
          assert 'override var mainUrl = "https://kisskh.co"' in provider
          assert "JvmTarget.JVM_1_8" in Path("build.gradle.kts").read_text()
          assert "jackson-module-kotlin:2.13.1" in Path("build.gradle.kts").read_text()
          assert not Path("d.kt").exists()

          print("Static Stage 1 validation passed")
          PY

      - name: Build KissKH
        shell: bash
        run: |
          set -o pipefail
          ./gradlew make makePluginsJson --no-daemon 2>&1 | tee stage1-build.log

      - name: Check CloudStream JAR compatibility
        shell: bash
        run: |
          set -o pipefail
          ./gradlew ensureJarCompatibility --no-daemon 2>&1 | tee -a stage1-build.log

      - name: Validate Stage 1 build
        shell: bash
        run: |
          set -euo pipefail

          test -f build/plugins.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          plugins = json.loads(Path("build/plugins.json").read_text())

          if not isinstance(plugins, list):
              raise SystemExit("build/plugins.json is not a JSON list")

          if len(plugins) != 1:
              raise SystemExit(f"Expected exactly 1 plugin entry, got {len(plugins)}")

          plugin = plugins[0]
          if str(plugin.get("name", "")).lower() != "kisskh":
              raise SystemExit(f"Expected KissKH plugin, got: {plugin.get('name')}")

          print("KissKH plugin metadata validation passed")
          PY

          CS3_COUNT="$(find . -type f -path '*/build/*.cs3' | wc -l)"
          if [[ "$CS3_COUNT" -ne 1 ]]; then
            echo "::error::Expected exactly one .cs3 file, got $CS3_COUNT."
            exit 1
          fi

          find . -type f -path '*/build/*.cs3' -print

      - name: Publish clean builds branch
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          PUBLISH_DIR="$RUNNER_TEMP/cloudstream-stage1-publish"
          BUILDS_DIR="$RUNNER_TEMP/cloudstream-stage1-builds"

          rm -rf "$PUBLISH_DIR" "$BUILDS_DIR"
          mkdir -p "$PUBLISH_DIR"

          while IFS= read -r -d '' file; do
            cp "$file" "$PUBLISH_DIR/"
          done < <(find . -type f -path '*/build/*.cs3' -print0)

          cp build/plugins.json "$PUBLISH_DIR/plugins.json"
          cp repo.json "$PUBLISH_DIR/repo.json"

          python3 - "$PUBLISH_DIR" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          plugins = json.loads((root / "plugins.json").read_text())

          if len(plugins) != 1:
              raise SystemExit("Refusing to publish an empty or unexpected plugins.json")

          cs3 = list(root.glob("*.cs3"))
          if len(cs3) != 1:
              raise SystemExit(f"Expected one .cs3 before publish, got {len(cs3)}")

          print(f"Publish gate passed: {cs3[0].name}")
          PY

          git fetch origin builds || true

          if git show-ref --verify --quiet refs/remotes/origin/builds; then
            git worktree add -B builds "$BUILDS_DIR" origin/builds
          else
            git worktree add --detach "$BUILDS_DIR" HEAD
            (
              cd "$BUILDS_DIR"
              git switch --orphan builds
            )
          fi

          (
            cd "$BUILDS_DIR"
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            cp -a "$PUBLISH_DIR"/. .
            git add -A

            if git diff --cached --quiet; then
              echo "Build outputs are unchanged."
            else
              git commit -m "Stage 1 clean build ${GITHUB_SHA}"
              git push origin builds --force
            fi
          )

      - name: Commit clean source to main
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -f .github/workflows/stage1-restore.yml

          git add -A

          if git diff --cached --quiet; then
            echo "Source tree already matches Stage 1."
          else
            git commit -m "Restore clean CloudStream foundation [skip ci]"
            git push origin HEAD:main
          fi

      - name: Stage 1 summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Stage 1 restore"
            echo
            echo "- Target repo: \`${GITHUB_REPOSITORY}\`"
            echo "- Provider: \`KissKH\`"
            echo "- Source domain: \`https://kisskh.co\`"
            echo "- JVM bytecode target: \`1.8\`"
            echo "- Gradle: \`8.12\`"
            echo "- Jackson: \`2.13.1\`"
            echo "- Build compatibility gate: \`ensureJarCompatibility\`"
            echo "- Empty plugin publication is blocked"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Stage 1 diagnose
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cloudstream-stage1-restore-diagnose
          path: |
            stage1-build.log
            build/plugins.json
            **/build/*.cs3
            build.gradle.kts
            settings.gradle.kts
            KissKH/build.gradle.kts
